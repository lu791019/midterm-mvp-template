services:
  pipeline:
    build: .
    command: python -m src.run_pipeline
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  dashboard:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
